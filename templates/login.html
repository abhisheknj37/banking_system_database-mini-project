{% extends 'layout.html' %}
{% block content %}
  <section class="login-page">
    <div class="login-card">
      <h1>Sign In</h1>
      <p>Access your banking dashboard with a secure login.</p>
      <form method="post">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@bank.com" required>
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>
        <button type="submit">Login</button>
      </form>
      <div class="login-note">
        <p>Use <strong>admin@bank.com</strong> / <strong>admin123</strong> to sign in.</p>
      </div>
    </div>
  </section>
{% endblock %}
