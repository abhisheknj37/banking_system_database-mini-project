{% extends 'layout.html' %}
{% block content %}
  <section>
    <h1>Transfer Funds</h1>
    <form method="post" class="form-card">
      <label>Source Account</label>
      <select name="source_account" required>
        <option value="">Select source</option>
        {% for account in accounts %}
          <option value="{{ account.id }}">{{ account.name }} ({{ account.email }}) - ${{ '{:.2f}'.format(account.balance) }}</option>
        {% endfor %}
      </select>
      <label>Target Account</label>
      <select name="target_account" required>
        <option value="">Select target</option>
        {% for account in accounts %}
          <option value="{{ account.id }}">{{ account.name }} ({{ account.email }})</option>
        {% endfor %}
      </select>
      <label>Amount</label>
      <input type="number" step="0.01" min="0.01" name="amount" required>
      <label>Note</label>
      <input type="text" name="note" placeholder="Transfer description">
      <button type="submit">Transfer</button>
    </form>
  </section>
{% endblock %}
