{% extends 'layout.html' %}
{% block content %}
  <section>
    <h1>New Branch</h1>
    <form method="post" class="form-card">
      <label>Name</label>
      <input type="text" name="name" required>
      <label>Address</label>
      <input type="text" name="address" required>
      <label>Phone</label>
      <input type="tel" name="phone" placeholder="Optional">
      <button type="submit">Create Branch</button>
    </form>
  </section>
{% endblock %}
